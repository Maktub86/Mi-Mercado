name: Actualizar precios de Mi Mercado

on:
  schedule:
    # 07:00 y 19:00 UTC (08:00 y 20:00 en Sevilla en invierno)
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar el lector de precios
        run: python -m unittest discover -s tests

      - name: Leer los precios de las tiendas
        run: python scripts/actualizar_precios.py

      - name: Guardar el historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/precios.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar precios"
            git pull --rebase
            git push
          fi
